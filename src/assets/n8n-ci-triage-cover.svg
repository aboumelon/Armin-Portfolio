<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" fill="none">
  <title>n8n CI Triage architecture</title>
  <desc>GitHub sends signed workflow events to a Python gateway. n8n orchestrates the Python service, PostgreSQL persists processing state, and the service publishes GitHub Issues and Telegram notifications.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#0A0B15"/>
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="78" x2="640" y2="134" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#67E8F9" stroke-opacity="0.04"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="url(#background)"/>
  <rect width="1200" height="640" fill="url(#grid)"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="64" y="58" fill="#94A3B8" font-size="15" letter-spacing="4">BACKEND + WORKFLOW AUTOMATION</text>
    <text x="64" y="125" fill="url(#accent)" font-size="54" font-weight="700">n8n CI Triage</text>
    <text x="64" y="166" fill="#94A3B8" font-size="22">CI failures become actionable reports.</text>

    <path d="M282 351H433" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="309" y="332" fill="#94A3B8" font-size="15">Signed event</text>
    <path d="M686 351H828" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="721" y="332" fill="#94A3B8" font-size="15">Report</text>
    <path d="M560 286V255" stroke="#64748B" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M560 416V463" stroke="#64748B" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <rect x="64" y="286" width="218" height="130" rx="18" fill="#141C2C" stroke="#334155"/>
    <circle cx="96" cy="322" r="6" fill="#F87171"/>
    <text x="115" y="329" fill="#F8FAFC" font-size="22" font-weight="600">GitHub Actions</text>
    <text x="88" y="371" fill="#94A3B8" font-size="17">Failure or recovery</text>

    <rect x="434" y="286" width="252" height="130" rx="18" fill="#102637" stroke="#22D3EE" stroke-opacity="0.6"/>
    <text x="460" y="329" fill="#CFFAFE" font-size="23" font-weight="600">Python gateway</text>
    <text x="460" y="362" fill="#94A3B8" font-size="17">Validate + analyze</text>
    <text x="460" y="389" fill="#94A3B8" font-size="17">Publish + notify</text>

    <rect x="434" y="194" width="252" height="61" rx="14" fill="#2A1932" stroke="#F472B6" stroke-opacity="0.55"/>
    <text x="460" y="232" fill="#F9A8D4" font-size="21" font-weight="600">n8n</text>
    <text x="515" y="232" fill="#CBD5E1" font-size="17">Orchestration</text>

    <rect x="434" y="464" width="252" height="78" rx="14" fill="#161D32" stroke="#818CF8" stroke-opacity="0.5"/>
    <text x="460" y="498" fill="#C7D2FE" font-size="21" font-weight="600">PostgreSQL</text>
    <text x="460" y="524" fill="#94A3B8" font-size="16">Durable queue + run state</text>

    <rect x="830" y="286" width="306" height="130" rx="18" fill="#142A28" stroke="#34D399" stroke-opacity="0.5"/>
    <circle cx="862" cy="322" r="6" fill="#34D399"/>
    <text x="881" y="329" fill="#D1FAE5" font-size="22" font-weight="600">Issues + Telegram</text>
    <text x="854" y="366" fill="#94A3B8" font-size="17">Evidence, repeat incidents,</text>
    <text x="854" y="392" fill="#94A3B8" font-size="17">and recovery notifications</text>

    <path d="M64 578H1136" stroke="#334155" stroke-opacity="0.65"/>
    <text x="64" y="612" fill="#94A3B8" font-size="15" letter-spacing="1">SIGNED WEBHOOKS</text>
    <text x="365" y="612" fill="#94A3B8" font-size="15" letter-spacing="1">INCIDENT DEDUPLICATION</text>
    <text x="767" y="612" fill="#94A3B8" font-size="15" letter-spacing="1">FAILURE + RECOVERY</text>
  </g>
</svg>
